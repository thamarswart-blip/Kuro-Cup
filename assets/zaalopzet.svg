<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Archivo, Helvetica, Arial, sans-serif" role="img" aria-label="Zaalopzet Kuro Cup">
  <title>Zaalopzet Kuro Cup — Dojo Kuro</title>
  <defs>
    <!-- Stoel -->
    <symbol id="stoel" viewBox="0 0 20 14"><path d="M1 13 V8 A9 7 0 0 1 19 8 V13 Z" fill="#fff" stroke="#121212" stroke-width="1.6"/></symbol>
    <!-- Scheidsrechter: stoel met rode en blauwe vlag -->
    <symbol id="ref" viewBox="0 0 44 36">
      <path d="M10 34 V24 A12 9 0 0 1 34 24 V34 Z" fill="#fff" stroke="#121212" stroke-width="1.8"/>
      <line x1="6" y1="30" x2="6" y2="6" stroke="#121212" stroke-width="1.8"/><path d="M6 6 H18 L15 11 L18 16 H6 Z" fill="#C8102E" stroke="#121212" stroke-width="1.2"/>
      <line x1="38" y1="30" x2="38" y2="6" stroke="#121212" stroke-width="1.8"/><path d="M38 6 H26 L29 11 L26 16 H38 Z" fill="#0166FF" stroke="#121212" stroke-width="1.2"/>
    </symbol>
    <!-- Tablet met papier en pen -->
    <symbol id="tablet" viewBox="0 0 24 16"><rect x="1" y="1" width="22" height="14" rx="2" fill="#fff" stroke="#121212" stroke-width="1.6"/><rect x="4" y="4" width="16" height="8" fill="#EEF0F3" stroke="#121212" stroke-width="0.8"/></symbol>
    <!-- Kumite-bal -->
    <symbol id="bal" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="#fff" stroke="#121212" stroke-width="2"/><circle cx="15" cy="15" r="3" fill="#121212"/></symbol>
    <!-- Deelnemer -->
    <symbol id="deelnemer" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#fff" stroke="#121212" stroke-width="2"/><circle cx="15" cy="11" r="4" fill="#121212"/><path d="M7 24 Q15 14 23 24" fill="none" stroke="#121212" stroke-width="2"/></symbol>
    <!-- Opgerolde banden -->
    <symbol id="band-rood" viewBox="0 0 12 30"><circle cx="6" cy="6" r="4.5" fill="#C8102E" stroke="#121212"/><circle cx="6" cy="15" r="4.5" fill="#C8102E" stroke="#121212"/><circle cx="6" cy="24" r="4.5" fill="#C8102E" stroke="#121212"/></symbol>
    <symbol id="band-blauw" viewBox="0 0 12 30"><circle cx="6" cy="6" r="4.5" fill="#0166FF" stroke="#121212"/><circle cx="6" cy="15" r="4.5" fill="#0166FF" stroke="#121212"/><circle cx="6" cy="24" r="4.5" fill="#0166FF" stroke="#121212"/></symbol>
    <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#121212"/></marker>
    <pattern id="arcering" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F2F3F5"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C9CDD2" stroke-width="3"/></pattern>
  </defs>

  <!-- Zaal -->
  <rect x="10" y="10" width="1080" height="760" fill="#fff"/>
  <rect x="20" y="20" width="1060" height="740" fill="none" stroke="#121212" stroke-width="4"/>

  <!-- Kleedkamers en publiek -->
  <path d="M20 20 H170 V105 H130 V215 H20 Z" fill="url(#arcering)" stroke="#121212" stroke-width="2.5"/>
  <text x="75" y="125" transform="rotate(-90 75 125)" text-anchor="middle" font-size="22" font-weight="600">Kleedkamers</text>
  <rect x="20" y="245" width="95" height="330" fill="url(#arcering)" stroke="#121212" stroke-width="2.5"/>
  <text x="68" y="410" transform="rotate(-90 68 410)" text-anchor="middle" font-size="22" font-weight="600">Publiek</text>

  <!-- Deelnemersbanken en administratie -->
  <rect x="330" y="48" width="230" height="34" fill="#fff" stroke="#121212" stroke-width="2"/>
  <text x="445" y="71" text-anchor="middle" font-size="17">Deelnemersbank</text>
  <rect x="760" y="48" width="230" height="34" fill="#fff" stroke="#121212" stroke-width="2"/>
  <text x="875" y="71" text-anchor="middle" font-size="17">Deelnemersbank</text>
  <use href="#stoel" x="634" y="40" width="26" height="18"/>
  <rect x="620" y="62" width="54" height="28" fill="#fff" stroke="#121212" stroke-width="2"/>
  <text x="647" y="112" text-anchor="middle" font-size="15" font-weight="600">Administratie</text>

  <!-- VELD 1: tafel boven de mat -->
  <use href="#stoel" x="408" y="118" width="26" height="18"/>
  <use href="#stoel" x="482" y="118" width="26" height="18"/>
  <rect x="380" y="138" width="160" height="38" fill="#fff" stroke="#121212" stroke-width="2"/>
  <use href="#band-rood" x="390" y="141" width="12" height="32"/>
  <use href="#tablet" x="446" y="148" width="28" height="19"/>
  <use href="#band-blauw" x="518" y="141" width="12" height="32"/>
  <text x="556" y="162" font-size="14">← banden + tablet</text>

  <!-- VELD 1: tatami 12 x 12 m -->
  <rect x="300" y="200" width="320" height="320" fill="#5EB3E4" stroke="#121212" stroke-width="2"/>
  <rect x="336" y="236" width="248" height="248" fill="#C8102E" stroke="#121212" stroke-width="1"/>
  <rect x="352" y="252" width="216" height="216" fill="#5EB3E4" stroke="#121212" stroke-width="1"/>
  <rect x="402" y="330" width="116" height="60" fill="#fff" stroke="#121212" stroke-width="1.5"/>
  <text x="460" y="358" text-anchor="middle" font-size="22" font-weight="700">VELD 1</text>
  <text x="460" y="380" text-anchor="middle" font-size="15">Kata · tatami</text>
  <line x1="280" y1="200" x2="280" y2="520" stroke="#121212" stroke-width="1.4" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
  <text x="270" y="364" text-anchor="end" font-size="16">12 m</text>
  <line x1="300" y1="610" x2="620" y2="610" stroke="#121212" stroke-width="1.4" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
  <text x="460" y="630" text-anchor="middle" font-size="16">12 m</text>
  <!-- Scheidsrechters veld 1 -->
  <use href="#ref" x="262" y="530" width="50" height="41"/>
  <use href="#ref" x="435" y="545" width="50" height="41"/>
  <use href="#ref" x="608" y="530" width="50" height="41"/>

  <!-- VELD 2: kumite -->
  <rect x="740" y="185" width="250" height="345" fill="#F7F8FA" stroke="#121212" stroke-width="2"/>
  <text x="845" y="350" text-anchor="middle" font-size="22" font-weight="700">VELD 2</text>
  <text x="845" y="372" text-anchor="middle" font-size="15">Kumite op de bal</text>
  <use href="#deelnemer" x="830" y="200" width="30" height="30"/>
  <use href="#bal" x="830" y="245" width="30" height="30"/>
  <use href="#bal" x="840" y="420" width="30" height="30"/>
  <use href="#deelnemer" x="840" y="466" width="30" height="30"/>
  <text x="870" y="222" font-size="13">deelnemer</text>
  <text x="870" y="266" font-size="13">kumite-bal</text>
  <!-- Scheidsrechters veld 2 -->
  <use href="#ref" x="690" y="200" width="44" height="36"/>
  <use href="#ref" x="690" y="340" width="44" height="36"/>
  <use href="#ref" x="690" y="480" width="44" height="36"/>
  <!-- Tafel veld 2 -->
  <rect x="955" y="290" width="38" height="120" fill="#fff" stroke="#121212" stroke-width="2"/>
  <use href="#band-rood" x="968" y="294" width="12" height="28"/>
  <use href="#tablet" x="962" y="337" width="24" height="17"/>
  <rect x="964" y="360" width="20" height="12" fill="#121212"/>
  <use href="#band-blauw" x="968" y="378" width="12" height="28"/>
  <use href="#stoel" x="1000" y="318" width="26" height="18" transform="rotate(90 1013 327)"/>
  <use href="#stoel" x="1000" y="372" width="26" height="18" transform="rotate(90 1013 381)"/>
  <text x="1000" y="430" font-size="12">tafel, banden,</text>
  <text x="1000" y="445" font-size="12">stopwatch-</text>
  <text x="1000" y="460" font-size="12">display</text>
  <!-- Stroomkabel -->
  <path d="M974 290 C 990 250, 1010 230, 1020 190 S 1050 120, 1078 70" fill="none" stroke="#121212" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1040" y="160" transform="rotate(-62 1040 160)" font-size="13">stroomkabel</text>

  <!-- Podium, Kuro kar, eten & drinken -->
  <g transform="rotate(-18 860 650)">
    <rect x="800" y="610" width="40" height="70" fill="#fff" stroke="#121212" stroke-width="2"/><text x="820" y="653" text-anchor="middle" font-size="22" font-weight="700">3</text>
    <rect x="840" y="590" width="40" height="90" fill="#EEF0F3" stroke="#121212" stroke-width="2"/><text x="860" y="643" text-anchor="middle" font-size="24" font-weight="700">1</text>
    <rect x="880" y="600" width="40" height="80" fill="#fff" stroke="#121212" stroke-width="2"/><text x="900" y="648" text-anchor="middle" font-size="22" font-weight="700">2</text>
  </g>
  <text x="840" y="722" text-anchor="middle" font-size="16" font-weight="600">Podium</text>
  <text x="840" y="740" text-anchor="middle" font-size="12">gymkasten + gelamineerde 1·2·3</text>
  <rect x="950" y="590" width="44" height="110" fill="#fff" stroke="#121212" stroke-width="2" transform="rotate(-18 972 645)"/>
  <text x="972" y="650" text-anchor="middle" font-size="14" font-weight="600" transform="rotate(-108 972 645)">Kuro kar</text>
  <rect x="1046" y="620" width="28" height="130" fill="#fff" stroke="#121212" stroke-width="2"/>
  <text x="1060" y="685" text-anchor="middle" font-size="13" font-weight="600" transform="rotate(-90 1060 685)">Eten &amp; drinken</text>

  <!-- Legenda -->
  <rect x="30" y="598" width="250" height="152" fill="#fff" stroke="#121212" stroke-width="1.5"/>
  <text x="44" y="622" font-size="16" font-weight="700">Legenda</text>
  <use href="#stoel" x="44" y="634" width="22" height="15"/><text x="74" y="647" font-size="13">Stoel</text>
  <rect x="44" y="660" width="22" height="13" fill="#fff" stroke="#121212" stroke-width="1.6"/><text x="74" y="672" font-size="13">Tafel</text>
  <circle cx="50" cy="691" r="5" fill="#C8102E" stroke="#121212"/><circle cx="62" cy="691" r="5" fill="#0166FF" stroke="#121212"/><text x="74" y="695" font-size="13">Banden</text>
  <use href="#ref" x="140" y="630" width="24" height="20"/><text x="170" y="647" font-size="13">Scheidsrechter</text>
  <use href="#tablet" x="141" y="659" width="22" height="15"/><text x="170" y="672" font-size="13">Tablet + papier</text>
  <use href="#bal" x="144" y="683" width="16" height="16"/><text x="170" y="695" font-size="13">Kumite-bal</text>
  <text x="44" y="722" font-size="11" fill="#5A6068">Niet op schaal, behalve de tatami</text>
  <text x="44" y="737" font-size="11" fill="#5A6068">van veld 1 (12 × 12 m).</text>
</svg>
